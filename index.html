<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>LinearAlgebra Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: lab bench with four rooms (lab, practice, elimination, theory) behind tabs; plot left, instrument panel right */
:root{
  --bg:#f3f5f9;--panel:#ffffff;--ink:#141829;--muted:#596074;--faint:#868ca0;
  --line:#dde1ea;--line2:#c3c9d6;--accent:#3443c4;--accent-bg:#e7e9fb;
  --ok:#1d7442;--ok-bg:#e1f3e8;--bad:#b42318;--bad-bg:#fbe9e7;--grid:#e5e8ef;--axis:#a5acbd;--plane:#e39a1f;--hl:#fff2cc;
  --v1:#5a4ed4;--v2:#0f8a72;--v3:#cf5226;--v4:#bf3876;--v5:#a8740c;
  --display:"Instrument Serif",Georgia,"Times New Roman",serif;
  --body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f121a;--panel:#171b26;--ink:#e7e9f1;--muted:#a1a7b8;--faint:#7a8094;
  --line:#272d3c;--line2:#384055;--accent:#8e98ff;--accent-bg:#222852;
  --ok:#72d49c;--ok-bg:#153424;--bad:#f97066;--bad-bg:#3a1b19;--grid:#222736;--axis:#4a5267;--plane:#e8a63a;--hl:#3a3218;
  --v1:#9b91ff;--v2:#3ccaa5;--v3:#f2845c;--v4:#ef72aa;--v5:#e2b443;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f121a;--panel:#171b26;--ink:#e7e9f1;--muted:#a1a7b8;--faint:#7a8094;
  --line:#272d3c;--line2:#384055;--accent:#8e98ff;--accent-bg:#222852;
  --ok:#72d49c;--ok-bg:#153424;--bad:#f97066;--bad-bg:#3a1b19;--grid:#222736;--axis:#4a5267;--plane:#e8a63a;--hl:#3a3218;
  --v1:#9b91ff;--v2:#3ccaa5;--v3:#f2845c;--v4:#ef72aa;--v5:#e2b443;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 48px}
.wrap{max-width:1360px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px}
h1{font:400 44px/1 var(--display);margin:0;letter-spacing:-0.01em}
h1 em{color:var(--accent)}
.sub{color:var(--muted);margin:6px 0 0;max-width:62ch}
h2{font:500 12px/1.2 var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 10px}
h3{font:400 24px/1.15 var(--display);margin:0;text-wrap:balance}
button{font:500 13px/1 var(--body);color:var(--ink);background:var(--panel);border:1px solid var(--line2);border-radius:7px;padding:8px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
button:hover{border-color:var(--ink)}
button:disabled{opacity:.45;cursor:default;border-color:var(--line2)}
button.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
select{font:500 13px var(--body);color:var(--ink);background:var(--panel);border:1px solid var(--line2);border-radius:7px;padding:6px 8px}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:9px;padding:3px;background:var(--panel)}
.seg button{border:0;border-radius:6px;padding:7px 14px;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
nav.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
nav.tabs button{border:0;border-bottom:2px solid transparent;border-radius:0;background:none;padding:12px 14px;font-size:14px;color:var(--muted);white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.app{display:grid;grid-template-columns:200px minmax(0,1fr);gap:28px;align-items:start}
.panes{min-width:0;display:flex;flex-direction:column}
nav.tabs{flex-direction:column;border-bottom:0;border-right:1px solid var(--line);position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);overflow:visible;padding-right:12px;gap:2px}
nav.tabs button{justify-content:flex-start;text-align:left;border-bottom:0;border-left:2px solid transparent;border-radius:0 7px 7px 0;padding:9px 12px}
nav.tabs button:hover{background:var(--panel)}
nav.tabs button[aria-selected="true"]{border-left-color:var(--accent);background:var(--panel)}
.navlbl{font:600 11px var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--faint);padding:14px 14px 6px}
.navlbl:first-child{padding-top:4px}
@media (max-width:860px){.app{grid-template-columns:minmax(0,1fr);gap:16px}nav.tabs{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);position:static;padding-right:0}nav.tabs button{border-left:0;border-bottom:2px solid transparent;border-radius:0;white-space:nowrap}nav.tabs button[aria-selected="true"]{border-bottom-color:var(--accent);background:none}.navlbl{display:none}}

.lab{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:1150px){.lab{grid-template-columns:minmax(0,1fr)}}
.plot{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;min-width:0}
.plot svg{display:block;width:100%;height:auto;touch-action:none;user-select:none}
.plotbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:4px 4px 10px}
.hint{font-size:13px;color:var(--faint)}
.side{display:flex;flex-direction:column;gap:14px;min-width:0}
.block{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.matwrap{overflow-x:auto;display:flex;align-items:stretch;gap:4px;padding:2px 0}
.br{width:8px;border:1.5px solid var(--muted);flex:none}
.br.l{border-right:0}.br.r{border-left:0}
.mat{border-collapse:collapse}
.mat th{font:500 15px var(--mono);padding:2px 4px 6px}
.mat td{padding:2px 3px}
.mat td.rl{font:12px var(--mono);color:var(--faint);padding-right:6px}
.mat input,.num{width:56px;height:32px;text-align:center;font:500 14px var(--mono);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px}
.bad{border-color:var(--bad)!important}
.err{font-size:13px;color:var(--bad);min-height:20px;margin:4px 0 2px}
.picks{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.picks button{font:500 15px var(--mono);min-width:44px;justify-content:center}
.picks button[aria-pressed="true"]{border-width:2px;border-color:currentColor}
.eq{font:500 20px/1.3 var(--mono);margin:0 0 8px;overflow-wrap:anywhere}
.how{font-size:14px;color:var(--muted);line-height:1.65}
.how code,.mono{font:13px var(--mono);color:var(--ink)}
.status{display:flex;flex-wrap:wrap;gap:8px}
.pill{font:500 13px/1 var(--body);padding:7px 11px;border-radius:999px;background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.pill.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.pill.info{background:var(--accent-bg);color:var(--accent);border-color:transparent}
.gram{border-collapse:collapse;font:13px var(--mono);font-variant-numeric:tabular-nums}
.gram th{font-weight:500;padding:4px 8px}
.gram td{padding:4px 8px;text-align:center;min-width:40px}
.gram td.z{background:var(--ok-bg);color:var(--ok);border-radius:5px}
.gram td.dg{color:var(--faint)}
.scroll{overflow-x:auto}
/* practice */
.prac{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:18px;align-items:start}
@media (max-width:1100px){.prac{grid-template-columns:minmax(0,1fr)}}
.excard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:14px;min-width:0}
.kind{font:500 12px var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--accent)}
.prompt{font-size:17px;line-height:1.6}
.vecs{display:flex;flex-wrap:wrap;gap:8px 18px;font:500 16px var(--mono)}
.answers{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.answers label{font:500 15px var(--mono);display:inline-flex;align-items:center;gap:6px}
.fb{border-radius:10px;padding:12px 14px;font-size:14px;line-height:1.65}
.fb.ok{background:var(--ok-bg);color:var(--ok)}
.fb.no{background:var(--bad-bg);color:var(--bad)}
.fb .how{color:inherit}
.hints{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.hints li{font-size:14px;color:var(--muted);border-left:2px solid var(--line2);padding:2px 0 2px 10px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--bg);border-radius:10px;padding:10px 12px}
.stat b{display:block;font:500 24px var(--mono);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button[aria-pressed="true"]{background:var(--accent-bg);color:var(--accent);border-color:var(--accent)}
/* elimination */
.elim{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:18px;align-items:start}
@media (max-width:1150px){.elim{grid-template-columns:minmax(0,1fr)}}
.show{border-collapse:collapse;font:500 15px var(--mono);font-variant-numeric:tabular-nums}
.show td{padding:6px 10px;text-align:center;min-width:46px;border-radius:5px}
.show td.piv{background:var(--accent-bg);color:var(--accent)}
.show tr.chg td{background:var(--hl)}
.show tr.chg td.piv{background:var(--accent-bg)}
.show th{font:500 13px var(--mono);padding:0 10px 4px;color:var(--muted)}
.op{font:500 15px var(--mono);color:var(--accent);min-height:24px;overflow-wrap:anywhere}
.deps{display:flex;flex-direction:column;gap:6px;font:500 14px var(--mono)}
/* theory */
.notes{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:14px}
.note{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:10px}
.note .alt{font:13px var(--mono);color:var(--faint)}
.note p{margin:0;color:var(--muted);font-size:14px}
.note p b{color:var(--ink);font-weight:500}
.f{font:500 14px/1.6 var(--mono);color:var(--ink);background:var(--bg);border-radius:7px;padding:8px 10px;overflow-x:auto}
.lbl{font:600 11px var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--faint);display:block;margin-bottom:2px}
.note .try{margin-top:auto;align-self:flex-start}
.mini{display:inline-flex;align-items:stretch;gap:3px;vertical-align:middle;margin:2px 4px}
.mini table{border-collapse:collapse;font:500 14px var(--mono);font-variant-numeric:tabular-nums}
.mini td{padding:2px 7px;text-align:center;color:var(--ink)}
.mini .br{width:6px}
.steps{display:flex;flex-direction:column;gap:18px}
.steps h4{font:400 21px/1.2 var(--display);margin:0 0 6px;color:var(--ink)}
.steps .how{overflow-x:auto}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font:500 14px var(--mono);overflow-wrap:anywhere}
input[type=range]{accent-color:var(--accent);flex:1;min-width:120px}
.aug td.bar{border-left:1.5px solid var(--muted)}
.sysrow td{padding:2px 2px;white-space:nowrap}
.sysrow .var{font:500 14px var(--mono);color:var(--muted);padding:0 4px}
.sysrow input{width:60px}
.case{border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.case .t{font:500 15px var(--body)}
.subhead{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
.subhead b{font:400 22px var(--display);margin-right:4px}
.review{display:flex;flex-direction:column;gap:8px}
.review details{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.review summary{cursor:pointer;font-size:14px}
.timer{font:500 15px var(--mono);font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

<div class="wrap">
<header>
  <div>
    <h1>LinearAlgebra <em>Lab</em></h1>
    <p class="sub" data-en="Orthogonality, linear independence, rank and linear combinations. Explore them visually, practise with endless exercises, then go further into systems, subspaces, linear maps, eigenvalues and data, with every calculation shown step by step." data-es="Ortogonalidad, independencia lineal, rango y combinaciones lineales. Explóralos visualmente, practica con ejercicios infinitos y avanza hacia sistemas, subespacios, aplicaciones lineales, valores propios y datos, con cada cálculo paso a paso."></p>
  </div>
  <div class="seg" role="group" aria-label="Language / Idioma">
    <button id="len" aria-pressed="true" onclick="setLang('en')">EN</button>
    <button id="les" aria-pressed="false" onclick="setLang('es')">ES</button>
  </div>
</header>

<div class="app">
<nav class="tabs" role="tablist" aria-orientation="vertical">
  <span class="navlbl" data-en="Learn" data-es="Aprender"></span>
  <button role="tab" id="tab-lab" aria-selected="true" onclick="showTab('lab')" data-en="Lab" data-es="Laboratorio"></button>
  <button role="tab" id="tab-practice" aria-selected="false" onclick="showTab('practice')" data-en="Practice" data-es="Ejercicios"></button>
  <button role="tab" id="tab-theory" aria-selected="false" onclick="showTab('theory')" data-en="Theory" data-es="Teoría"></button>
  <span class="navlbl" data-en="Tools" data-es="Herramientas"></span>
  <button role="tab" id="tab-elimination" aria-selected="false" onclick="showTab('elimination')" data-en="Elimination in ℝⁿ" data-es="Eliminación en ℝⁿ"></button>
  <button role="tab" id="tab-sys" aria-selected="false" onclick="showTab('sys')" data-en="Systems" data-es="Sistemas"></button>
  <button role="tab" id="tab-sub" aria-selected="false" onclick="showTab('sub')" data-en="Subspaces" data-es="Subespacios"></button>
  <button role="tab" id="tab-basis" aria-selected="false" onclick="showTab('basis')" data-en="Change of basis" data-es="Cambio de base"></button>
  <button role="tab" id="tab-gs" aria-selected="false" onclick="showTab('gs')">Gram–Schmidt</button>
  <button role="tab" id="tab-maps" aria-selected="false" onclick="showTab('maps')" data-en="Linear maps" data-es="Aplicaciones lineales"></button>
  <button role="tab" id="tab-eig" aria-selected="false" onclick="showTab('eig')" data-en="Eigenvalues" data-es="Valores propios"></button>
  <button role="tab" id="tab-data" aria-selected="false" onclick="showTab('data')" data-en="Data and AI" data-es="Datos e IA"></button>
</nav>
<div class="panes">

<!-- LAB -->
<section id="p-lab" class="lab">
  <div class="plot">
    <div class="plotbar">
      <div class="seg" role="group" aria-label="Dimension">
        <button id="m2" aria-pressed="true" onclick="setDim(2)">ℝ²</button>
        <button id="m3" aria-pressed="false" onclick="setDim(3)">ℝ³</button>
      </div>
      <span class="hint" id="hint"></span>
    </div>
    <div class="row" id="presets" style="padding:0 4px 8px"></div>
    <svg id="pl" viewBox="0 0 680 460" role="img" aria-label="Vectors plot">
      <defs id="defs"></defs>
      <g id="grid"></g><g id="spanG"></g><g id="ras"></g><g id="vecs"></g><g id="build"></g>
      <text id="cap" x="16" y="448" style="font:12px var(--body);fill:var(--faint)"></text>
    </svg>
    <div class="status" id="status" style="padding:10px 4px 2px"></div>
  </div>
  <div class="side">
    <div class="block">
      <h2 data-en="Matrix A · one vector per column" data-es="Matriz A · un vector por columna"></h2>
      <div class="matwrap"><span class="br l"></span><table class="mat" id="mat"></table><span class="br r"></span></div>
      <div class="err" id="err" role="alert"></div>
      <div class="row">
        <button id="addc" onclick="addV()" data-en="+ Column" data-es="+ Columna"></button>
        <button id="remc" onclick="remV()" data-en="− Column" data-es="− Columna"></button>
        <button onclick="resetMode()" data-en="Reset" data-es="Restablecer"></button>
        <button onclick="loadGS(d,S().V.map(v=>v.slice(0,d)),0)" data-en="Orthogonalize →" data-es="Ortogonalizar →"></button>
      </div>
    </div>
    <div class="block">
      <h2 data-en="Build a vector from the others" data-es="Construir un vector con los demás"></h2>
      <div class="picks" id="picks"></div>
      <p class="eq" id="eq"></p>
      <div class="how" id="how"></div>
      <div class="row" style="margin-top:12px"><button onclick="play()" data-en="▶ Replay" data-es="▶ Repetir"></button></div>
    </div>
    <div class="block">
      <h2 data-en="Dot products AᵀA · green = orthogonal pair" data-es="Productos escalares AᵀA · verde = par ortogonal"></h2>
      <div class="scroll"><table class="gram" id="gram"></table></div>
    </div>
  </div>
</section>

<!-- PRACTICE -->
<section id="p-practice" class="prac" hidden>
  <div class="excard" id="excard"></div>
  <div class="side">
    <div class="block">
      <h2 data-en="Your score" data-es="Tu puntuación"></h2>
      <div class="stats">
        <div class="stat"><b id="s-right">0</b><span data-en="correct" data-es="aciertos"></span></div>
        <div class="stat"><b id="s-total">0</b><span data-en="attempted" data-es="intentados"></span></div>
        <div class="stat"><b id="s-streak">0</b><span data-en="current streak" data-es="racha actual"></span></div>
        <div class="stat"><b id="s-best">0</b><span data-en="best streak" data-es="mejor racha"></span></div>
      </div>
      <div class="how" id="weak" style="margin-top:10px"></div>
      <div class="row" style="margin-top:10px"><button onclick="resetScore()" data-en="Reset score" data-es="Reiniciar puntuación"></button></div>
    </div>
    <div class="block">
      <h2 data-en="Exam mode" data-es="Modo examen"></h2>
      <p class="how" style="margin:0 0 10px" data-en="A timed mix of the selected types, 2 minutes per question, no hints. You see the corrections at the end." data-es="Una mezcla cronometrada de los tipos seleccionados, 2 minutos por pregunta, sin pistas. Las correcciones se ven al final."></p>
      <div class="row"><label for="exn" class="hint" data-en="Questions" data-es="Preguntas"></label><select id="exn"><option>5</option><option selected>10</option><option>15</option><option>20</option></select><button class="primary" onclick="startExam()" data-en="Start exam" data-es="Empezar examen"></button></div>
    </div>
    <div class="block">
      <h2 data-en="Exercise types" data-es="Tipos de ejercicio"></h2>
      <div class="chips" id="chips"></div>
      <div class="err" id="chiperr"></div>
      <div class="row"><button id="smartbtn" onclick="toggleSmart()"></button></div>
    </div>
  </div>
</section>

<!-- ELIMINATION -->
<section id="p-elimination" class="elim" hidden>
  <div class="side">
    <div class="block">
      <h2 data-en="Vectors as columns" data-es="Vectores en columnas"></h2>
      <div class="row" style="margin-bottom:10px">
        <label for="er" class="hint" data-en="Dimension n" data-es="Dimensión n"></label><select id="er" onchange="resizeE()"></select>
        <label for="ec" class="hint" data-en="Vectors" data-es="Vectores"></label><select id="ec" onchange="resizeE()"></select>
      </div>
      <div class="matwrap"><span class="br l"></span><table class="mat" id="emat"></table><span class="br r"></span></div>
      <div class="err" id="eerr" role="alert"></div>
      <p class="hint" style="margin:0 0 10px" data-en="Integers, decimals or fractions like 3/4." data-es="Enteros, decimales o fracciones como 3/4."></p>
      <div class="row">
        <button onclick="exampleE()" data-en="Example in ℝ⁴" data-es="Ejemplo en ℝ⁴"></button>
        <button onclick="randomE()" data-en="Random" data-es="Aleatoria"></button>
        <button onclick="clearE()" data-en="Clear" data-es="Vaciar"></button>
      </div>
    </div>
    <div class="block">
      <h2 data-en="Result" data-es="Resultado"></h2>
      <div class="status" id="estatus" style="margin-bottom:12px"></div>
      <div class="how" id="esum"></div>
      <div class="row" style="margin-top:12px"><button onclick="elimToGS()" data-en="Orthogonalize with Gram–Schmidt →" data-es="Ortogonalizar con Gram–Schmidt →"></button></div>

function rankOf(L){const M=L.map(a=>a.slice());const m=M.length?M[0].length:0;let r=0;for(let c=0;c<m&&r<M.length;c++){let p=-1,b=1e-9;for(let i=r;i<M.length;i++)if(Math.abs(M[i][c])>b){b=Math.abs(M[i][c]);p=i}if(p<0)continue;[M[r],M[p]]=[M[p],M[r]];for(let i=0;i<M.length;i++)if(i!==r){const k=M[i][c]/M[r][c];for(let j=0;j<m;j++)M[i][j]-=k*M[r][j]}r++}return r}

 if(B.length===2){const[a,b]=B.map(i=>V[i]),g11=dot(a,a),g12=dot(a,b),g22=dot(b,b),r1=dot(w,a),r2=dot(w,b),D=g11*g22-g12*g12;co=[(r1*g22-r2*g12)/D,(g11*r2-g12*r1)/D]}
 else co=[dot(w,V[B[0]])/dot(V[B[0]],V[B[0]])];

 return{N,sx,sy,sxx,sxy,syy,ls,mx,my,cxx,cxy,cyy,l1,l2:Math.max(0,l2),v1,v2:[-v1[1],v1[0]]}}

const NOTES=[
 {en:'Linear combination',es:'Combinación lineal',
  def:['A vector w is a linear combination of v₁, …, vₖ when w = c₁v₁ + … + cₖvₖ for some scalars cᵢ.','Un vector w es combinación lineal de v₁, …, vₖ si w = c₁v₁ + … + cₖvₖ para ciertos escalares cᵢ.'],
  ex:'(2, 4) = 1·(3, 1) + 1·(−1, 3)',

 {en:'Span',es:'Subespacio generado',
  def:['The span of a set is the set of all its linear combinations. It is always a subspace and always contains 0.','El subespacio generado (envoltura lineal) es el conjunto de todas sus combinaciones lineales. Siempre es un subespacio y siempre contiene el 0.'],

 {en:'Linear independence',es:'Independencia lineal',

  go:{lab:[2,[[2,1],[-2,-1],[4,2]],2]}},
 {en:'Rank',es:'Rango',
  def:['The rank of A is the number of pivots after Gaussian elimination: the maximum number of independent columns, which equals the maximum number of independent rows.','El rango de A es el número de pivotes tras la eliminación gaussiana: el máximo número de columnas independientes, que coincide con el de filas independientes.'],
  ex:'rank [[1, 2], [2, 4]] = 1',

 {en:'Basis and dimension',es:'Base y dimensión',
  def:['A basis is an independent set that spans the space. Every basis has the same number of vectors: the dimension.','Una base es un conjunto independiente que genera el espacio. Todas las bases tienen el mismo número de vectores: la dimensión.'],
  ex:'{(1,0,0), (0,1,0), (0,0,1)}  ⇒  dim ℝ³ = 3',

  trap:['A basis is not unique; the dimension is.','La base no es única; la dimensión sí.'],

 {en:'Dot product and orthogonality',es:'Producto escalar y ortogonalidad',
  def:['u · v = u₁v₁ + … + uₙvₙ = |u||v| cos θ. The vectors are orthogonal when u · v = 0.','u · v = u₁v₁ + … + uₙvₙ = |u||v| cos θ. Los vectores son ortogonales cuando u · v = 0.'],
  ex:'(1, 2, 2) · (2, 1, −2) = 2 + 2 − 4 = 0',
  trick:['To find k that makes two vectors orthogonal, the dot product is linear in k: set it to 0 and solve.','Para hallar k que haga ortogonales dos vectores, el producto escalar es lineal en k: iguálalo a 0 y despeja.'],

 {en:'Orthogonal implies independent',es:'Ortogonal implica independiente',
  def:['Nonzero, pairwise orthogonal vectors are independent. Dot c₁v₁ + … + cₖvₖ = 0 with vⱼ: you get cⱼ|vⱼ|² = 0, so cⱼ = 0.','Vectores no nulos y ortogonales dos a dos son independientes. Multiplica c₁v₁ + … + cₖvₖ = 0 escalarmente por vⱼ: queda cⱼ|vⱼ|² = 0, luego cⱼ = 0.'],
  ex:'(1,1,0), (1,−1,0), (0,0,1)',
  trick:['In an orthogonal basis, coordinates need no system: cⱼ = (w · vⱼ) / (vⱼ · vⱼ).','En una base ortogonal las coordenadas no necesitan sistema: cⱼ = (w · vⱼ) / (vⱼ · vⱼ).'],

 {en:'Orthogonal projection',es:'Proyección ortogonal',
  def:['The projection of w onto u is the part of w that points along u: proj_u(w) = ((w·u) / (u·u))·u. What is left over, w − proj_u(w), is orthogonal to u.','La proyección de w sobre u es la parte de w en la dirección de u: proj_u(w) = ((w·u) / (u·u))·u. Lo que sobra, w − proj_u(w), es ortogonal a u.'],
  ex:'w=(2, 3), u=(1, 1): (5/2)·(1, 1) = (5/2, 5/2)',

  trap:['Divide by u·u = ‖u‖², not by ‖u‖. Only for a unit vector u does the formula reduce to (w·u)·u.','Divide entre u·u = ‖u‖², no entre ‖u‖. Solo con u unitario la fórmula queda (w·u)·u.'],
  go:{gs:[2,[[1,1],[2,3]],2]}},
 {en:'Gram–Schmidt process',es:'Proceso de Gram–Schmidt',
  def:['Turns v₁, …, vₖ into orthogonal u₁, …, uₖ with the same span: u₁ = v₁, and each uₖ is vₖ minus its projections onto u₁, …, uₖ₋₁.','Transforma v₁, …, vₖ en u₁, …, uₖ ortogonales con el mismo subespacio generado: u₁ = v₁, y cada uₖ es vₖ menos sus proyecciones sobre u₁, …, uₖ₋₁.'],
  ex:'v₁=(3, 1), v₂=(2, 2): u₂ = v₂ − (8/10)·u₁ = (−2/5, 6/5)',

  trap:['Project onto the u’s already built, never onto the original v’s. If some uₖ = 0, vₖ was dependent on the previous vectors.','Proyecta sobre los u ya construidos, nunca sobre los v originales. Si algún uₖ = 0, vₖ dependía de los anteriores.'],
  go:{gs:[2,[[3,1],[2,2]],0]}},
 {en:'Orthonormal basis',es:'Base ortonormal',
  def:['An orthogonal basis whose vectors all have length 1: eᵢ·eⱼ = 0 for i ≠ j and eᵢ·eᵢ = 1. Normalize with eₖ = uₖ / ‖uₖ‖.','Una base ortogonal cuyos vectores tienen todos longitud 1: eᵢ·eⱼ = 0 si i ≠ j y eᵢ·eᵢ = 1. Se normaliza con eₖ = uₖ / ‖uₖ‖.'],
  ex:'(1/√2)·(1, 1), (1/√2)·(1, −1)',
  trick:['Coordinates are plain dot products: w = (w·e₁)e₁ + … + (w·eₙ)eₙ. With these vectors as columns of Q, QᵀQ = I, so a square Q has Q⁻¹ = Qᵀ.','Las coordenadas son productos escalares: w = (w·e₁)e₁ + … + (w·eₙ)eₙ. Con estos vectores como columnas de Q, QᵀQ = I, así que si Q es cuadrada, Q⁻¹ = Qᵀ.'],
  trap:['Normalize at the end. Normalizing early puts square roots into every later step.','Normaliza al final. Si normalizas antes, arrastras raíces cuadradas en todos los pasos siguientes.'],
  go:{gs:[3,[[1,1,0],[1,0,1],[0,1,1]],4]}},
 {en:'Determinant test',es:'Criterio del determinante',
  def:['n vectors in ℝⁿ are independent if and only if det[v₁ … vₙ] ≠ 0. In ℝ³, |det| is the volume of the box they span.','n vectores de ℝⁿ son independientes si y solo si det[v₁ … vₙ] ≠ 0. En ℝ³, |det| es el volumen del paralelepípedo que forman.'],
  ex:'det [[1, 3], [2, 4]] = 1·4 − 3·2 = −2 ≠ 0',

 {en:"Cramer's rule",es:'Regla de Cramer',
  def:['If det A ≠ 0, the solution of A·x = b is xᵢ = det Aᵢ / det A, where Aᵢ is A with column i replaced by b.','Si det A ≠ 0, la solución de A·x = b es xᵢ = det Aᵢ / det A, donde Aᵢ es A con la columna i sustituida por b.'],
  ex:'u=(3,1), v=(−1,3), w=(2,4): a = det[w v]/det[u v] = 10/10 = 1',
  trick:['Fast for 2×2 and 3×3. Beyond that, elimination is less work.','Rápida en 2×2 y 3×3. A partir de ahí, la eliminación requiere menos cálculo.'],

 {en:'Gaussian elimination',es:'Eliminación gaussiana',
  def:['Row operations (swap rows, multiply a row by a nonzero number, add a multiple of another row) keep the rank and the dependencies between columns.','Las operaciones por filas (intercambiar, multiplicar una fila por un número no nulo, sumar un múltiplo de otra) conservan el rango y las dependencias entre columnas.'],
  ex:'R₂ ← R₂ − 2R₁',
  trick:['In the reduced form, each non-pivot column holds the coefficients that write that vector using the pivot vectors.','En la forma reducida, cada columna sin pivote contiene los coeficientes que la escriben con los vectores pivote.'],
  trap:['Row operations change the vectors themselves. Read the relations from the reduced form, but take the vectors from the original matrix.','Las operaciones por filas cambian los propios vectores. Lee las relaciones en la forma reducida, pero toma los vectores de la matriz original.'],

 {en:'Linear map and its matrix',es:'Aplicación lineal y su matriz',
  def:['f is linear when f(u + v) = f(u) + f(v) and f(cu) = c·f(u). Every linear map ℝⁿ → ℝᵐ is x ↦ Ax, and the columns of A are the images of e₁, …, eₙ.','f es lineal si f(u + v) = f(u) + f(v) y f(cu) = c·f(u). Toda aplicación lineal ℝⁿ → ℝᵐ es x ↦ Ax, y las columnas de A son las imágenes de e₁, …, eₙ.'],
  ex:'90°: e₁ ↦ (0, 1), e₂ ↦ (−1, 0)  ⇒  A = [[0, −1], [1, 0]]',
  trick:['To build A, work out where each basis vector goes and write it as a column. Then A·v is the same combination of those columns.','Para construir A, calcula a dónde va cada vector de la base y escríbelo como columna. Después A·v es la misma combinación de esas columnas.'],
  trap:['A linear map always sends 0 to 0. x ↦ x + b with b ≠ 0 is not linear (it is affine).','Una aplicación lineal siempre envía el 0 al 0. x ↦ x + b con b ≠ 0 no es lineal (es afín).'],
  go:{maps:[[0,-1],[1,0]]}},
 {en:'Kernel and image',es:'Núcleo e imagen',
  def:['ker A = {x : Ax = 0} and im A = {Ax} = span of the columns. Rank–nullity: dim ker A + rank A = number of columns.','ker A = {x : Ax = 0} e im A = {Ax} = subespacio generado por las columnas. Teorema rango–nulidad: dim ker A + rango A = número de columnas.'],
  ex:'A = [[1, 2], [2, 4]]: ker = span{(−2, 1)}, im = span{(1, 2)}, 1 + 1 = 2',
  trick:['Kernel basis: solve Ax = 0 from the reduced form (one vector per free variable). Image basis: the pivot columns of the original A.','Base del núcleo: resuelve Ax = 0 en la forma reducida (un vector por variable libre). Base de la imagen: las columnas pivote de la A original.'],
  trap:['Injective ⇔ ker A = {0}. Surjective ⇔ im A is the whole target. For a square matrix both mean det A ≠ 0.','Inyectiva ⇔ ker A = {0}. Sobreyectiva ⇔ im A es todo el espacio de llegada. En una matriz cuadrada ambas equivalen a det A ≠ 0.'],
  go:{maps:[[1,2],[2,4]]}},
 {en:'Determinant as a scale factor',es:'El determinante como factor de escala',
  def:['|det A| is the factor by which A multiplies areas (volumes in ℝ³). A negative determinant means orientation is reversed.','|det A| es el factor por el que A multiplica las áreas (volúmenes en ℝ³). Un determinante negativo significa que se invierte la orientación.'],
  ex:'A = [[2, 0], [0, 1/2]]: det = 1, shapes change but areas do not',
  trick:['det(AB) = det A · det B, det(A⁻¹) = 1 / det A, det(Aᵀ) = det A.','det(AB) = det A · det B, det(A⁻¹) = 1 / det A, det(Aᵀ) = det A.'],
  trap:['det(A + B) ≠ det A + det B, and det(cA) = cⁿ·det A, not c·det A.','det(A + B) ≠ det A + det B, y det(cA) = cⁿ·det A, no c·det A.'],
  go:{maps:[[2,0],[0,0.5]]}},
 {en:'Eigenvalues and eigenvectors',es:'Valores y vectores propios',
  def:['v ≠ 0 is an eigenvector with eigenvalue λ when Av = λv: A only stretches v along its own line.','v ≠ 0 es un vector propio con valor propio λ si Av = λv: A solo estira v a lo largo de su propia recta.'],
  ex:'[[2, 1], [1, 2]]·(1, 1) = (3, 3) = 3·(1, 1)',
  trick:['The eigenvectors for λ are the nonzero vectors of ker(A − λI). λ = 0 is an eigenvalue exactly when A is not invertible.','Los vectores propios de λ son los vectores no nulos de ker(A − λI). λ = 0 es valor propio exactamente cuando A no es invertible.'],
  trap:['The zero vector is never an eigenvector, but λ = 0 can perfectly well be an eigenvalue.','El vector nulo nunca es vector propio, pero λ = 0 sí puede ser valor propio.'],
  go:{maps:[[2,1],[1,2]]}},
 {en:'Characteristic polynomial',es:'Polinomio característico',
  def:['The eigenvalues are the roots of p(λ) = |A − λI|, a polynomial of degree n.','Los valores propios son las raíces de p(λ) = |A − λI|, un polinomio de grado n.'],
  ex:'[[4, 1], [2, 3]]: λ² − 7λ + 10 = (λ − 5)(λ − 2)',
  trick:['Sum of eigenvalues = tr A and product = det A. In a triangular matrix the eigenvalues are the diagonal entries.','Suma de valores propios = tr A y producto = det A. En una matriz triangular los valores propios son los de la diagonal.'],
  trap:['Subtract λ only on the diagonal. Use the trace and determinant checks to catch sign errors.','Resta λ solo en la diagonal. Usa las comprobaciones de traza y determinante para detectar errores de signo.'],
  go:{eig:[[4,1],[2,3]]}},
 {en:'Diagonalization',es:'Diagonalización',
  def:['A is diagonalizable when A = PDP⁻¹ with D diagonal. The columns of P are n independent eigenvectors and D holds their eigenvalues in the same order.','A es diagonalizable si A = PDP⁻¹ con D diagonal. Las columnas de P son n vectores propios independientes y D contiene sus valores propios en el mismo orden.'],
  ex:'[[4, 1], [2, 3]] = P·diag(5, 2)·P⁻¹, P = [[1, 1], [1, −2]]',
  trick:['Distinct eigenvalues ⇒ diagonalizable. Symmetric ⇒ diagonalizable with orthogonal P. And Aᵏ = PDᵏP⁻¹ makes powers easy.','Valores propios distintos ⇒ diagonalizable. Simétrica ⇒ diagonalizable con P ortogonal. Y Aᵏ = PDᵏP⁻¹ facilita las potencias.'],
  trap:['Every eigenvalue needs as many independent eigenvectors as its multiplicity. [[1, 1], [0, 1]] has λ = 1 twice but only one eigenvector.','Cada valor propio necesita tantos vectores propios independientes como su multiplicidad. [[1, 1], [0, 1]] tiene λ = 1 doble pero un solo vector propio.'],
  go:{eig:[[1,1],[0,1]]}},
 {en:'Rouché–Frobenius theorem',es:'Teorema de Rouché–Frobenius',
  def:['Ax = b has a solution exactly when rank A = rank A*, where A* = (A | b). It is unique when that rank equals the number of unknowns n; otherwise there are infinitely many, with n − rank free parameters.','Ax = b tiene solución exactamente cuando rango A = rango A*, con A* = (A | b). Es única si ese rango es igual al número de incógnitas n; si no, hay infinitas, con n − rango parámetros libres.'],
  ex:['rank A = rank A* = 2 < 3 unknowns ⇒ SCI with 1 parameter','rango A = rango A* = 2 < 3 incógnitas ⇒ SCI con 1 parámetro'],
  trick:['For a square system, |A| ≠ 0 already means SCD. Only the values that make |A| = 0 need a closer look.','En un sistema cuadrado, |A| ≠ 0 ya significa SCD. Solo hay que estudiar con detalle los valores que anulan |A|.'],
  trap:['Compare rank A* with rank A, not with the number of equations. Extra equations can be redundant.','Compara el rango de A* con el de A, no con el número de ecuaciones. Puede haber ecuaciones redundantes.'],
  go:{sys:2}},
 {en:'Discussing a system with a parameter',es:'Discusión de un sistema con parámetro',
  def:['Find the values of the parameter where the ranks can change (for a square system, the roots of |A|). Then study the general case and each of those values separately.','Busca los valores del parámetro donde pueden cambiar los rangos (en un sistema cuadrado, las raíces de |A|). Después estudia el caso general y cada uno de esos valores por separado.'],
  ex:'(a 1 1 | 1; 1 a 1 | 1; 1 1 a | 1): |A| = (a − 1)²(a + 2)',
  trick:['Factor |A| with row or column operations before expanding. Here, adding all the columns to the first gives the common factor (a + 2).','Factoriza |A| con operaciones de filas o columnas antes de desarrollar. Aquí, sumar todas las columnas a la primera da el factor común (a + 2).'],
  trap:['Substitute each critical value into the original system and reduce again. Do not reuse a reduction where you divided by an expression that is now 0.','Sustituye cada valor crítico en el sistema original y reduce de nuevo. No reutilices una reducción en la que dividiste por una expresión que ahora vale 0.'],
  go:{sys:0}},
 {en:'Implicit and parametric equations',es:'Ecuaciones implícitas y paramétricas',
  def:['A subspace can be described by generators (parametric form, x = λu + μv) or by homogeneous equations (implicit form). It needs n − dim independent implicit equations.','Un subespacio se puede describir con generadores (forma paramétrica, x = λu + μv) o con ecuaciones homogéneas (forma implícita). Necesita n − dim ecuaciones implícitas independientes.'],
  ex:'span{(1, 0, 1), (0, 1, 1)} ⇔ x + y − z = 0',
  trick:['Generators to equations: put the generators and a generic (x, y, z) in a matrix and require its rank not to grow (its minors vanish). Equations to generators: solve the homogeneous system.','De generadores a ecuaciones: pon los generadores y un (x, y, z) genérico en una matriz y exige que el rango no aumente (sus menores se anulan). De ecuaciones a generadores: resuelve el sistema homogéneo.'],
  trap:['Implicit equations of a subspace are always homogeneous (= 0). x + y = 1 describes an affine plane, which does not contain 0.','Las ecuaciones implícitas de un subespacio siempre son homogéneas (= 0). x + y = 1 describe un plano afín, que no contiene el 0.'],
  go:{sub:0}},
 {en:'Sum, intersection and Grassmann',es:'Suma, intersección y Grassmann',
  def:['U + W is spanned by the generators of both. U ∩ W is defined by the implicit equations of both together. Grassmann: dim(U + W) = dim U + dim W − dim(U ∩ W).','U + W está generado por los generadores de ambos. U ∩ W se define con las ecuaciones implícitas de ambos juntas. Grassmann: dim(U + W) = dim U + dim W − dim(U ∩ W).'],
  ex:['Two different planes in ℝ³: 3 = 2 + 2 − 1, so they meet in a line','Dos planos distintos en ℝ³: 3 = 2 + 2 − 1, así que se cortan en una recta'],
  trick:['Compute whichever is easier, dim(U + W) (a rank) or dim(U ∩ W), and get the other one from Grassmann.','Calcula lo más fácil, dim(U + W) (un rango) o dim(U ∩ W), y obtén lo otro con Grassmann.'],
  trap:['U ∪ W is usually not a subspace; the sum is the smallest subspace containing both. U ⊕ W (direct sum) means U ∩ W = {0}.','U ∪ W normalmente no es un subespacio; la suma es el menor subespacio que contiene a ambos. U ⊕ W (suma directa) significa U ∩ W = {0}.'],
  go:{sub:0}},
 {en:'Change of basis',es:'Cambio de base',
  def:['If P_B has the vectors of B as columns, then v = P_B·[v]_B, so [v]_B = P_B⁻¹·v. From B to C: [v]_C = P_C⁻¹·P_B·[v]_B.','Si P_B tiene los vectores de B en columnas, entonces v = P_B·[v]_B, así que [v]_B = P_B⁻¹·v. De B a C: [v]_C = P_C⁻¹·P_B·[v]_B.'],
  ex:'B = {(1, 1), (−1, 1)}, v = (3, 1): [v]_B = (2, −1)',
  trick:['The columns of the change matrix from B to C are the vectors of B written in coordinates of C.','Las columnas de la matriz de cambio de B a C son los vectores de B escritos en coordenadas de C.'],
  trap:['Direction matters: P_B turns B-coordinates into standard ones. Going the other way needs the inverse.','La dirección importa: P_B convierte coordenadas en B en canónicas. Para ir al revés hace falta la inversa.'],
  go:{basis:0}},
 {en:'Matrix of a map in another basis',es:'Matriz de una aplicación en otra base',
  def:['If A is the matrix of a map in the standard basis, in basis B the same map has matrix P⁻¹AP. These are similar matrices: same determinant, trace, rank and eigenvalues.','Si A es la matriz de una aplicación en la base canónica, en la base B la misma aplicación tiene matriz P⁻¹AP. Son matrices semejantes: mismo determinante, traza, rango y valores propios.'],
  ex:'A = [[2, 1], [1, 2]], B = {(1, 1), (1, −1)}: P⁻¹AP = diag(3, 1)',
  trick:['Diagonalizing is exactly choosing a basis of eigenvectors, where the matrix becomes diagonal.','Diagonalizar es exactamente elegir una base de vectores propios, en la que la matriz se vuelve diagonal.'],
  trap:['Similar matrices share eigenvalues but not eigenvectors: P converts the eigenvectors between the two bases.','Las matrices semejantes comparten valores propios pero no vectores propios: P convierte los vectores propios de una base a otra.'],
  go:{basis:2}},
 {en:'Least squares',es:'Mínimos cuadrados',
  def:['When Ax = b has no solution, the best approximation x̂ solves the normal equations AᵀA·x̂ = Aᵀb. Then Ax̂ is the orthogonal projection of b onto the column space of A.','Cuando Ax = b no tiene solución, la mejor aproximación x̂ resuelve las ecuaciones normales AᵀA·x̂ = Aᵀb. Entonces Ax̂ es la proyección ortogonal de b sobre el espacio columna de A.'],
  ex:['Fitting y = mx + c: the columns of A are (x₁, …, xₙ) and (1, …, 1)','Ajuste y = mx + c: las columnas de A son (x₁, …, xₙ) y (1, …, 1)'],
  trick:['The residual r = b − Ax̂ is orthogonal to every column of A, so Aᵀr = 0. That one fact gives the normal equations.','El residuo r = b − Ax̂ es ortogonal a todas las columnas de A, así que Aᵀr = 0. De ahí salen directamente las ecuaciones normales.'],
  trap:['Least squares minimizes vertical distances (errors in y), not perpendicular ones. Swapping x and y gives a different line.','Mínimos cuadrados minimiza las distancias verticales (errores en y), no las perpendiculares. Intercambiar x e y da otra recta.'],
  go:{data:0}},
 {en:'Principal component analysis',es:'Análisis de componentes principales',
  def:['The eigenvectors of the covariance matrix point in the directions of greatest variance, and each eigenvalue is the variance along its direction.','Los vectores propios de la matriz de covarianza apuntan en las direcciones de mayor varianza, y cada valor propio es la varianza en su dirección.'],
  ex:['λ₁ / (λ₁ + λ₂) = share of the variance explained by PC1','λ₁ / (λ₁ + λ₂) = parte de la varianza explicada por PC1'],
  trick:['The covariance matrix is symmetric, so its eigenvectors are orthogonal (spectral theorem): the principal axes are perpendicular.','La matriz de covarianza es simétrica, así que sus vectores propios son ortogonales (teorema espectral): los ejes principales son perpendiculares.'],
  trap:['Center the data (subtract the mean) first. PCA is sensitive to scale, so variables in different units are usually standardized.','Centra los datos (resta la media) primero. PCA depende de la escala, así que las variables con distintas unidades se suelen estandarizar.'],
  go:{data:1}}];
const NGROUPS=[['vec','Vectors and rank','Vectores y rango',['Linear combination','Span','Linear independence','Rank','Basis and dimension','Determinant test','Gaussian elimination']],['sys','Systems and subspaces','Sistemas y subespacios',["Cramer's rule",'Rouché–Frobenius theorem','Discussing a system with a parameter','Implicit and parametric equations','Sum, intersection and Grassmann']],['orth','Orthogonality','Ortogonalidad',['Dot product and orthogonality','Orthogonal implies independent','Orthogonal projection','Gram–Schmidt process','Orthonormal basis']],['maps','Linear maps and bases','Aplicaciones lineales y bases',['Linear map and its matrix','Kernel and image','Determinant as a scale factor','Change of basis','Matrix of a map in another basis']],['eig','Eigenvalues','Valores propios',['Eigenvalues and eigenvectors','Characteristic polynomial','Diagonalization']],['data','Data and AI','Datos e IA',['Least squares','Principal component analysis']]];
let NF=load('nfilter')||'all';
const GOL={lab:['Try it in the lab →','Pruébalo en el laboratorio →'],gs:['Try it in Gram–Schmidt →','Pruébalo en Gram–Schmidt →'],maps:['Try it in linear maps →','Pruébalo en aplicaciones lineales →'],eig:['Try it in eigenvalues →','Pruébalo en valores propios →'],elim:['Try it in elimination →','Pruébalo en eliminación →'],sys:['Try it in systems →','Pruébalo en sistemas →'],sub:['Try it in subspaces →','Pruébalo en subespacios →'],basis:['Try it in change of basis →','Pruébalo en cambio de base →'],data:['Try it in data and AI →','Pruébalo en datos e IA →']};
function noteCard(n,i){const k=Object.keys(n.go)[0];return`<article class="note"><div><h3>${T(n.en,n.es)}</h3><div class="alt">${T('ES: '+n.es,'EN: '+n.en)}</div></div><p>${T(...n.def)}</p><div><span class="lbl">${T('Example','Ejemplo')}</span><div class="f">${Array.isArray(n.ex)?T(...n.ex):n.ex}</div></div><p><span class="lbl">${T('Trick','Truco')}</span>${T(...n.trick)}</p><p><span class="lbl">${T('Exam trap','Trampa de examen')}</span>${T(...n.trap)}</p><button class="try" onclick="tryNote(${i})">${T(...GOL[k])}</button></article>`}
function renderNotes(){$('nfilter').innerHTML=`<button aria-pressed="${NF==='all'}" onclick="NF='all';save('nfilter',NF);renderNotes()">${T('All topics','Todos los temas')}</button>`+NGROUPS.map(([id,en,es])=>`<button aria-pressed="${NF===id}" onclick="NF='${id}';save('nfilter',NF);renderNotes()">${T(en,es)}</button>`).join('');
 const box=$('notes');box.className='';box.innerHTML=NGROUPS.filter(g=>NF==='all'||g[0]===NF).map(([id,en,es,names])=>{const items=names.map(nm=>NOTES.findIndex(n=>n.en===nm)).filter(i=>i>=0);return`<h2 style="margin:18px 0 10px">${T(en,es)}</h2><div class="notes">${items.map(i=>noteCard(NOTES[i],i)).join('')}</div>`}).join('')}
function tryNote(i){const g=NOTES[i].go;if(g.lab)loadLab(g.lab[0],g.lab[1],g.lab[2]);else if(g.gs)loadGS(g.gs[0],g.gs[1],g.gs[2]);else if(g.maps)loadMaps(g.maps);else if(g.eig)loadEig(g.eig.map(r=>r.map(String)));else if(g.sys!==undefined)loadSys(SYP[g.sys][2],SYP[g.sys][3]);else if(g.sub!==undefined){const p=SBP[g.sub];loadSub(p[2],p[3],p[4])}else if(g.basis!==undefined){const p=CBP[g.basis];loadCB(p[2],p[3],p[4],p[5])}else if(g.data!==undefined){DP=DPRE[g.data][2].map(p=>p.slice());showTab('data')}else loadElim(g.elim);window.scrollTo({top:0,behavior:'smooth'})}

/* ================= SHELL ================= */
const TABS=['lab','practice','theory','elimination','sys','sub','basis','gs','maps','eig','data'];let tab='lab';
function showTab(t){tab=t;TABS.forEach(x=>{$('p-'+x).hidden=x!==t;$('tab-'+x).setAttribute('aria-selected',x===t)});save('tab',t);if(t==='lab')rebuild();if(t==='gs'){gsvg.style.cursor=G.n===3?'grab':'default';drawG()}if(t==='maps')drawMaps();if(t==='basis')drawCB();if(t==='data')drawData()}
function applyStatic(){document.documentElement.lang=lang;document.querySelectorAll('[data-en]').forEach(el=>el.textContent=el.dataset[lang]);$('len').setAttribute('aria-pressed',lang==='en');$('les').setAttribute('aria-pressed',lang==='es')}
function setLang(l){lang=l;save('lang',l);applyStatic();buildPresets();rebuild();renderEx();renderChips();buildE();renderE();buildG();renderG();buildMaps();drawMaps();buildEig();computeEig();buildSys();computeSys();buildSub();computeSub();buildCB();computeCB();buildData();drawData();renderScore();renderNotes()}
(function init(){
 const s=load('lab');if(s&&s.ST&&s.ST[2]&&s.ST[3]){ST=s.ST;d=s.d===3?3:2;yaw=+s.yaw||-0.6;pitch=+s.pitch||0.4}
 lang=load('lang')||((navigator.language||'').toLowerCase().startsWith('es')?'es':'en');
 applyStatic();fillSelects();buildE();computeE(true);fillGSelects();buildG();computeG(true);buildMaps();buildEig();computeEig();buildSys();computeSys();buildSub();computeSub();buildCB();computeCB();buildData();renderNotes();renderChips();renderScore();gen();
 const h=location.hash.slice(1);showTab(TABS.includes(h)?h:(load('tab')&&TABS.includes(load('tab'))?load('tab'):'lab'));setDim(d);
})();
</script>
